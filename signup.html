<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>회원등록 | DOIL SERVICE</title>
    <meta name="robots" content="noindex,nofollow,noarchive">
    <link rel="icon" type="image/png" href="assets/doil-logo-symbol.png">
    <link rel="stylesheet" href="styles.css?v=20260712-member-signup-1">
  </head>
  <body class="auth-body member-signup-body">
    <main class="auth-layout">
      <section class="auth-panel signup-panel member-signup-panel">
        <div>
          <a class="brand member-signup-brand" href="index.html"><img class="brand-logo" src="assets/doil-logo-symbol.png" alt=""><span>DOIL SERVICE</span></a>
          <h1>회원등록</h1>
          <p>거래에 필요한 기본 정보를 입력하면 담당자가 확인 후 회원 목록에 반영합니다.</p>
        </div>

        <form class="auth-form member-signup-form" data-member-signup-form>
          <div class="signup-type-grid" role="group" aria-label="회원 구분">
            <label class="signup-type-card active" data-signup-type-card>
              <input type="radio" name="memberType" value="사업자" checked>
              <strong>사업자</strong>
              <span>상호명, 사업자등록번호, 업종/업태를 함께 등록합니다.</span>
            </label>
            <label class="signup-type-card" data-signup-type-card>
              <input type="radio" name="memberType" value="개인">
              <strong>개인</strong>
              <span>개인 의뢰자는 성함과 연락처 중심으로 등록합니다.</span>
            </label>
          </div>

          <div class="admin-form-grid two member-signup-grid">
            <label data-business-only><span>상호명</span><input name="companyName" type="text" placeholder="예: 가나다식품"></label>
            <label data-business-only><span>사업자등록번호</span><input name="businessNumber" type="text" placeholder="000-00-00000"></label>
            <label data-business-only><span>업종</span><input name="industry" type="text" placeholder="예: 광고디자인"></label>
            <label data-business-only><span>업태</span><input name="businessType" type="text" placeholder="예: 서비스업"></label>
            <label><span>성함(대표자명)</span><input name="manager" type="text" placeholder="예: 홍길동" required></label>
            <label><span>연락처</span><input name="phone" type="tel" placeholder="010-0000-0000" required></label>
            <label class="wide"><span>이메일</span><input name="email" type="email" placeholder="client@example.com" required></label>
            <label class="wide" data-business-only><span>사업자등록증</span><input name="businessCertificate" type="file" accept="image/*,.pdf"></label>
            <label class="wide"><span>요청 메모</span><textarea name="requestMemo" rows="4" placeholder="필요한 업무나 전달사항을 남겨주세요."></textarea></label>
          </div>

          <label class="agreement-check member-signup-agree">
            <input type="checkbox" name="agree" required>
            <span>회원등록을 위한 정보 수집 및 담당자 확인에 동의합니다.</span>
          </label>

          <button class="button primary auth-submit" type="submit">등록 요청</button>
          <p class="signup-success" data-member-signup-success hidden>등록 요청이 접수되었습니다. 담당자가 확인 후 연락드립니다.</p>
        </form>
      </section>
    </main>
    <script src="app.js?v=20260712-member-signup-1"></script>
  </body>
</html>
